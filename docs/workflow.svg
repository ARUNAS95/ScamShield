<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 900" width="1420" height="900" font-family="Helvetica, Arial, sans-serif">
  <title>ScamShield workflow: how one message is checked</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E35B1"/>
    </marker>
    <style>
      .model { fill: #EDE7F6; stroke: #5E35B1; stroke-width: 3; }
      .py { fill: #E6F4EC; stroke: #2E7D5B; stroke-width: 2.5; }
      .gate { fill: #E6F4EC; stroke: #1B5E3F; stroke-width: 4; }
      .tool { fill: #FFF3E0; stroke: #D97706; stroke-width: 2.5; }
      .stop { fill: #FDECEA; stroke: #C62828; stroke-width: 2.5; }
      .final { fill: #1F3A5F; stroke: #1F3A5F; stroke-width: 2; }
      .pill { fill: #FFFFFF; stroke: #5E35B1; stroke-width: 2; stroke-dasharray: 6 4; }
      .menu { fill: #FAF8FF; stroke: #5E35B1; stroke-width: 2; }
      .line { stroke: #37474F; stroke-width: 2.5; fill: none; }
      .back { stroke: #5E35B1; stroke-width: 2.5; fill: none; }
      .dash { stroke: #5E35B1; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
      .h { font-size: 21px; font-weight: bold; fill: #1A1A1A; }
      .t { font-size: 17px; fill: #263238; }
      .s { font-size: 15px; fill: #37474F; }
      .lab { font-size: 16px; font-weight: bold; fill: #37474F; }
      .labp { font-size: 16px; font-weight: bold; fill: #5E35B1; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 17px; font-weight: bold; fill: #4527A0; }
      .cond { font-size: 14.5px; fill: #455A64; }
      .w { fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="0" y="0" width="1420" height="900" fill="#FFFFFF"/>

  <!-- Row 1: message, input check, model, parser, validator -->
  <rect class="py" x="30" y="60" width="160" height="100" rx="12" style="fill:#F5F7FA;stroke:#607D8B"/>
  <text class="h" x="110" y="102" text-anchor="middle">Text message</text>
  <text class="t" x="110" y="128" text-anchor="middle">+ sender</text>

  <path class="line" d="M190,110 L228,110" marker-end="url(#arrow)"/>

  <rect class="py" x="230" y="60" width="190" height="100" rx="12"/>
  <text class="h" x="325" y="96" text-anchor="middle">Input check</text>
  <text class="t" x="325" y="120" text-anchor="middle">empty or</text>
  <text class="t" x="325" y="141" text-anchor="middle">too long?</text>

  <path class="line" d="M325,160 L325,198" marker-end="url(#arrow)"/>
  <text class="lab" x="340" y="186">fails</text>
  <rect class="stop" x="230" y="200" width="190" height="62" rx="12"/>
  <text class="t" x="325" y="226" text-anchor="middle" font-weight="bold">Stop: invalid_input</text>
  <text class="s" x="325" y="248" text-anchor="middle">answer: not sure</text>

  <path class="line" d="M420,110 L468,110" marker-end="url(#arrow)"/>
  <text class="lab" x="444" y="100" text-anchor="middle">ok</text>

  <rect class="model" x="470" y="50" width="280" height="120" rx="14"/>
  <text class="h" x="610" y="84" text-anchor="middle" style="fill:#311B92">Model chooses</text>
  <text class="h" x="610" y="110" text-anchor="middle" style="fill:#311B92">ONE action</text>
  <text class="mono" x="610" y="136" text-anchor="middle" style="font-size:15px">{"action", "argument"}</text>
  <text class="s" x="610" y="158" text-anchor="middle">qwen3:8b via Ollama, JSON</text>

  <path class="line" d="M750,110 L788,110" marker-end="url(#arrow)"/>

  <rect class="py" x="790" y="60" width="190" height="100" rx="12"/>
  <text class="h" x="885" y="94" text-anchor="middle">Parser</text>
  <text class="t" x="885" y="119" text-anchor="middle">valid JSON?</text>
  <text class="t" x="885" y="141" text-anchor="middle">action + argument?</text>

  <path class="line" d="M980,110 L1028,110" marker-end="url(#arrow)"/>

  <rect class="py" x="1030" y="60" width="340" height="110" rx="12"/>
  <text class="h" x="1200" y="90" text-anchor="middle">Validator</text>
  <text class="t" x="1200" y="114" text-anchor="middle">allowed now? (routing preconditions)</text>
  <text class="t" x="1200" y="136" text-anchor="middle">argument taken from the message?</text>
  <text class="t" x="1200" y="158" text-anchor="middle">not a repeated call?</text>

  <!-- Rejections go back to the model -->
  <path class="line" d="M885,160 L885,213" marker-end="url(#arrow)"/>
  <path class="line" d="M1060,170 L1060,246 L982,246" marker-end="url(#arrow)"/>
  <text class="lab" x="1068" y="212">rejected</text>
  <rect class="pill" x="790" y="215" width="190" height="62" rx="31"/>
  <text class="t" x="885" y="241" text-anchor="middle" style="fill:#4527A0">reason + allowed</text>
  <text class="t" x="885" y="263" text-anchor="middle" style="fill:#4527A0">actions</text>
  <path class="back" d="M790,246 L700,246 L700,173" marker-end="url(#arrowp)"/>
  <text class="labp" x="745" y="236" text-anchor="middle">feedback</text>

  <!-- Tool path -->
  <path class="line" d="M1200,170 L1200,288" marker-end="url(#arrow)"/>
  <text class="lab" x="1208" y="236">tool</text>

  <rect class="tool" x="1030" y="290" width="270" height="90" rx="12"/>
  <text class="h" x="1165" y="320" text-anchor="middle">Tool runs (Python)</text>
  <text class="t" x="1165" y="344" text-anchor="middle">local lookups only,</text>
  <text class="t" x="1165" y="366" text-anchor="middle">never opens links</text>

  <path class="line" d="M1165,380 L1165,418" marker-end="url(#arrow)"/>

  <rect class="py" x="1030" y="420" width="270" height="90" rx="12"/>
  <text class="h" x="1165" y="450" text-anchor="middle">Post-action check</text>
  <text class="t" x="1165" y="474" text-anchor="middle">did the promised state</text>
  <text class="t" x="1165" y="496" text-anchor="middle">change really happen?</text>
  <text class="s" x="1165" y="532" text-anchor="middle" style="fill:#C62828">fails: tool_failure, tool not offered again</text>

  <path class="line" d="M1030,465 L962,465" marker-end="url(#arrow)"/>
  <text class="lab" x="996" y="456" text-anchor="middle">ok</text>

  <rect class="py" x="480" y="420" width="480" height="90" rx="12"/>
  <text class="h" x="720" y="450" text-anchor="middle">Evidence E1, E2, ... recorded</text>
  <text class="t" x="720" y="474" text-anchor="middle">+ evidence ledger (never trimmed)</text>
  <text class="t" x="720" y="496" text-anchor="middle">+ AVAILABLE ACTIONS for the next step</text>

  <path class="back" d="M600,420 L600,173" marker-end="url(#arrowp)"/>
  <text class="labp" x="612" y="290">tool result goes</text>
  <text class="labp" x="612" y="310">back to the model</text>

  <!-- The model's menu -->
  <path class="dash" d="M500,170 L500,320 L422,320"/>
  <rect class="menu" x="30" y="300" width="390" height="410" rx="14"/>
  <text class="h" x="50" y="332" style="fill:#311B92">The model's choices</text>
  <text class="cond" x="50" y="354">one per step; Python offers only the ones allowed now</text>
  <text class="mono" x="50" y="390">extract_signals</text>
  <text class="cond" x="50" y="410">always first, only once</text>
  <text class="mono" x="50" y="437">check_link</text>
  <text class="cond" x="50" y="457">a link from the message is still unchecked</text>
  <text class="mono" x="50" y="484">check_sender</text>
  <text class="cond" x="50" y="504">the real sender, only once</text>
  <text class="mono" x="50" y="531">lookup_official_contact</text>
  <text class="cond" x="50" y="551">an organization the message claims to be</text>
  <text class="mono" x="50" y="578">search_scam_guide</text>
  <text class="cond" x="50" y="598">metadata RAG over the guide, up to 3 times</text>
  <text class="mono" x="50" y="625">ask_human_helper</text>
  <text class="cond" x="50" y="645">after check_sender, once, only with consent</text>
  <text class="mono" x="50" y="672" style="fill:#1B5E3F">done</text>
  <text class="cond" x="50" y="692">label + evidence ids + explanation: verdict gate</text>

  <!-- Done path: the verdict gate -->
  <path class="line" d="M1345,170 L1345,558" marker-end="url(#arrow)"/>
  <text class="lab" x="1337" y="236" text-anchor="end">done</text>

  <rect class="gate" x="1030" y="560" width="340" height="110" rx="12"/>
  <text class="h" x="1200" y="590" text-anchor="middle">Verdict gate (Python)</text>
  <text class="t" x="1200" y="614" text-anchor="middle">does the recorded evidence</text>
  <text class="t" x="1200" y="636" text-anchor="middle">support this label?</text>
  <text class="s" x="1200" y="658" text-anchor="middle">feedback shows expected vs actual</text>

  <path class="line" d="M1030,615 L962,615" marker-end="url(#arrow)"/>
  <text class="lab" x="996" y="604" text-anchor="middle" style="font-size:14px">passes</text>

  <path class="line" d="M1105,670 L1105,703" marker-end="url(#arrow)"/>
  <rect class="pill" x="1030" y="705" width="160" height="62" rx="31"/>
  <text class="t" x="1110" y="731" text-anchor="middle" style="fill:#4527A0">1st rejection:</text>
  <text class="t" x="1110" y="753" text-anchor="middle" style="fill:#4527A0">&#8634; to the model</text>

  <path class="line" d="M1300,670 L1300,773" marker-end="url(#arrow)"/>
  <text class="lab" x="1308" y="716" style="font-size:15px">2nd</text>
  <text class="lab" x="1308" y="734" style="font-size:15px">time</text>

  <rect class="py" x="1030" y="775" width="340" height="90" rx="12"/>
  <text class="h" x="1200" y="805" text-anchor="middle">Python uses the label</text>
  <text class="t" x="1200" y="829" text-anchor="middle">the evidence supports</text>
  <text class="s" x="1200" y="851" text-anchor="middle">(stop reason gate_downgrade)</text>

  <rect class="py" x="650" y="560" width="310" height="110" rx="12"/>
  <text class="h" x="805" y="590" text-anchor="middle">Readability check</text>
  <text class="t" x="805" y="614" text-anchor="middle">verdict first, at most 6 short</text>
  <text class="t" x="805" y="636" text-anchor="middle">sentences, no jargon,</text>
  <text class="t" x="805" y="658" text-anchor="middle">no links or numbers</text>

  <path class="line" d="M650,615 L622,615" marker-end="url(#arrow)"/>
  <rect class="pill" x="440" y="584" width="180" height="62" rx="31"/>
  <text class="t" x="530" y="610" text-anchor="middle" style="fill:#4527A0">too hard: rewrite</text>
  <text class="t" x="530" y="632" text-anchor="middle" style="fill:#4527A0">once &#8634; to the model</text>

  <path class="line" d="M805,670 L805,773" marker-end="url(#arrow)"/>
  <text class="lab" x="815" y="716">ok (or Python's template</text>
  <text class="lab" x="815" y="736">after one rewrite)</text>

  <path class="line" d="M1030,820 L962,820" marker-end="url(#arrow)"/>

  <rect class="final" x="480" y="775" width="480" height="110" rx="14"/>
  <text class="h w" x="720" y="805" text-anchor="middle">Final answer</text>
  <text class="t w" x="720" y="829" text-anchor="middle">likely scam / likely safe / not sure + plain explanation</text>
  <text class="t w" x="720" y="851" text-anchor="middle">+ "what to do" written by Python from trusted data</text>
  <text class="t w" x="720" y="873" text-anchor="middle">+ JSON trace of every step</text>

  <!-- Legend -->
  <rect class="model" x="40" y="736" width="26" height="20" rx="4"/>
  <text class="s" x="76" y="752">the model decides</text>
  <rect class="py" x="230" y="736" width="26" height="20" rx="4"/>
  <text class="s" x="266" y="752">Python checks</text>
  <rect class="tool" x="40" y="768" width="26" height="20" rx="4"/>
  <text class="s" x="76" y="784">Python runs a tool</text>
  <rect class="stop" x="230" y="768" width="26" height="20" rx="4"/>
  <text class="s" x="266" y="784">stops the run</text>
  <text class="s" x="40" y="818">&#8634; = sent back to the model as the next</text>
  <text class="s" x="40" y="838">message; the loop stops after 10 steps or</text>
  <text class="s" x="40" y="858">3 rejected proposals in a row</text>
</svg>
